name: Build FF Panel
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          git clone https://github.com/theos/sdks.git $GITHUB_WORKSPACE/sdks-repo
          mkdir -p $GITHUB_WORKSPACE/theos/sdks
          cp -r $GITHUB_WORKSPACE/sdks-repo/*.sdk $GITHUB_WORKSPACE/theos/sdks/
          rm -rf $GITHUB_WORKSPACE/sdks-repo

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ffpanel-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7

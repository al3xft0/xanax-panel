name: Build FF Panel
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: theos

      - name: Install ldid
        run: |
          brew install ldid
          echo "PATH=/opt/homebrew/bin:$PATH" >> $GITHUB_ENV
          which ldid
          ldid 2>&1 | head -5 || true

      - name: Build package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH="/opt/homebrew/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ffpanel-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
